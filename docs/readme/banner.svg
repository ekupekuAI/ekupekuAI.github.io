<style>
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .net line { stroke: #94a3b8; stroke-width: 0.8; }
  .net circle { fill: #94a3b8; fill-opacity: 0.5; }
  .net .hot { fill: #22c55e; fill-opacity: 0.95; transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
  .sig { stroke: #86efac; stroke-width: 2.2; stroke-linecap: round; animation: travel 3s linear infinite; }
  .glow { animation: drift 14s ease-in-out infinite alternate; }
  .bgword { animation: parallax 18s ease-in-out infinite alternate; }
  .title { animation: focus 1.6s cubic-bezier(.22,1,.36,1) both; }
  .kicker { animation: rise 1.2s .25s cubic-bezier(.22,1,.36,1) both; }
  .tag { animation: rise 1.2s .55s cubic-bezier(.22,1,.36,1) both; }
  .bar { animation: grow 1.4s .4s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; transform-origin: left center; }
  .s1 { animation: hue1 6s ease-in-out infinite alternate; }
  .s2 { animation: hue2 6s ease-in-out infinite alternate; }
  .live { animation: blink 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); fill-opacity: .55 } 50% { transform: scale(2.1); fill-opacity: 1 } }
  @keyframes travel { from { stroke-dashoffset: var(--len) } to { stroke-dashoffset: 0 } }
  @keyframes drift { from { transform: translate(0,0) } to { transform: translate(-260px, 30px) } }
  @keyframes parallax { from { transform: translateX(40px) } to { transform: translateX(-60px) } }
  @keyframes focus { from { opacity: 0; filter: blur(14px); transform: translateY(18px) scale(.96) } to { opacity: 1; filter: blur(0); transform: none } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
  @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @keyframes hue1 { from { stop-color: #22c55e } to { stop-color: #4ade80 } }
  @keyframes hue2 { from { stop-color: #86efac } to { stop-color: #16a34a } }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @media (prefers-reduced-motion: reduce) {
    *, .sig { animation: none !important; }
    .sig { display: none; }
  }
</style>
